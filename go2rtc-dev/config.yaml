# https://github.com/AlexxIT/builder/blob/master/builder.sh
name: go2rtc (VaBank)
description: Dev version for advanced beta testers. Experimental features, for testing potential updates
url: https://github.com/Mo3he/go2rtc/tree/hksv
image: ghcr.io/Mo3he/go2rtc
arch: [ amd64, aarch64, i386, armv7 ]

# https://developers.home-assistant.io/docs/add-ons/configuration
version: hksv
slug: go2rtc-hksv
init: false
startup: system
host_network: true
homeassistant_api: true
video: true
audio: true
ingress: true
ingress_port: 1984
panel_icon: mdi:camera-wireless
map: [ "config:rw", "media", "ssl" ]
